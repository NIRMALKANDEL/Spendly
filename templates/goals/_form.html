{% import "_macros.html" as m with context %}
<form method="POST">
    {{ m.csrf() }}
    <div class="form-group">
        <label for="goal-name">Goal name</label>
        <input type="text" id="goal-name" name="name" value="{{ form.name or '' }}" class="form-input" maxlength="60" placeholder="e.g. Emergency fund" required>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label for="goal-target">Target amount</label>
            <input type="text" inputmode="decimal" id="goal-target" name="target" value="{{ form.target or '' }}" class="form-input" placeholder="100000" required>
        </div>
        <div class="form-group">
            <label for="goal-saved">Already saved</label>
            <input type="text" inputmode="decimal" id="goal-saved" name="saved" value="{{ form.saved or '' }}" class="form-input" placeholder="0">
        </div>
    </div>
    <div class="form-group">
        <label for="goal-date">Target date <span class="muted">(optional)</span></label>
        <input type="date" id="goal-date" name="target_date" value="{{ form.target_date or '' }}" class="form-input">
    </div>
    <div class="form-actions"><button type="submit" class="btn-primary">{{ "Save goal" if goal else "Create goal" }}</button></div>
</form>
