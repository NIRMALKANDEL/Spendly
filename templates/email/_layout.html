<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Spendly</title></head>
<body style="margin:0;padding:0;background:#f7f6f3;font-family:Arial,Helvetica,sans-serif;color:#0f0f0f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f6f3;padding:32px 16px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e4e1da;border-radius:12px;">
        <tr><td style="padding:28px 28px 8px;font-size:18px;font-weight:bold;color:#1a472a;">&#9672; Spendly</td></tr>
        <tr><td style="padding:8px 28px 28px;font-size:15px;line-height:1.6;">
          {% block body %}{% endblock %}
        </td></tr>
      </table>
      <p style="font-size:12px;color:#8a877f;margin-top:16px;">You received this because of activity on your Spendly account.</p>
    </td></tr>
  </table>
</body>
</html>
